```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
</head>
<body>
    <h1>Edit Employee Details</h1>

    <form method="POST">
        <label>Employee Name</label>
        <input name="name" value="{{ employee[0] }}" required>
        <br><br>

        <label>Employee Role</label>
        <input name="role" value="{{ employee[1] }}" required>
        <br><br>

        <label>Salary</label>
        <input name="salary" type="number" step="0.01"
               value="{{ employee[2] }}" required>
        <br><br>

        <button type="submit">Update Employee</button>
    </form>

    <br>
    <a href="/">Back to Home</a>
</body>
</html>
